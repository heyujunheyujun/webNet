name: CD

# 触发条件，只有推送到 main 分支时才部署
on:
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

env:
  # 私有仓库地址
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 关键：配置 GitHub Runner 的 Docker daemon
      - name: Configure Docker for insecure registry
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "insecure-registries": ["${{ env.REGISTRY }}"]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          # 等待 Docker 重启完成
          sleep 5
          docker info | grep -A 5 "Insecure Registries"
        
      - name: Convert repository name to lowercase
        run: |
          echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
  